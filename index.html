<body>


<div class="app">

🌙 Sweet Dream

Personal AI Narrative System

<div class="card">

<div class="card">

</h3>


<select id="presetSelect">

</select>


<button onclick="loadPreset()">

加载预设

</button>


<button onclick="savePreset()">

保存当前为预设

</button>


</div>




<div class="card">


<h3>
💾 存档
</h3>


<select id="saveSelect">

</select>


<button onclick="saveSlot()">

保存存档

</button>


<button onclick="loadSlot()">

placeholder="输入行动">

发送

</button>

<script>


/*

================================

Sweet Dream V1.1

IndexedDB Core

================================

*/



const DB_NAME =
"SweetDreamV11";


const DB_VERSION =
1;



const STORES=[

"settings",

"presets",

"saves",

"current",

"backups"

];



let db=null;




/*

默认数据

*/


const DEFAULT_GAME={


worldBook:"",


owner:"",


memory:[],


messages:[],


state:{


level:1,


affection:0,


trust:0,


dependency:0,


day:1,


relationship:""

}


};





/*

打开数据库

*/


function openDB(){


return new Promise(

(resolve,reject)=>{


let request=
indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=e=>{


let database=
e.target.result;



STORES.forEach(
store=>{


if(
!database.objectStoreNames.contains(store)
){

database.createObjectStore(
store,
{
keyPath:"id"
}
);

}


}
);



};



request.onsuccess=e=>{


db=e.target.result;

resolve();

};



request.onerror=e=>{

reject(e);

};



}

);



}




/*

数据库写入

*/


function put(store,id,value){


return new Promise(resolve=>{


let tx=
db.transaction(
store,
"readwrite"
);


tx.objectStore(store)
.put({

id:id,

value:value

});



tx.oncomplete=resolve;



});


}




/*

数据库读取

*/


function get(store,id){


return new Promise(resolve=>{


let tx=
db.transaction(
store,
"readonly"
);



let req=
tx.objectStore(store)
.get(id);



req.onsuccess=()=>{


resolve(
req.result?
req.result.value:
null
);


};


});


}





/*

获取当前游戏

*/


async function getGame(){


let game=
await get(
"current",
"main"
);



if(!game){


game=
structuredClone(
DEFAULT_GAME
);



await put(
"current",
"main",
game
);


}


return game;


}





/*

保存当前游戏

*/


async function saveGame(game){


await put(
"current",
"main",
game
);



document.getElementById(
"dbStatus"
).innerHTML=
"✓ 自动保存完成";


}





async function init(){


await openDB();



await getGame();



document.getElementById(
"dbStatus"
).innerHTML=
"✓ IndexedDB运行正常";


render();


}

/*

========================================

第二部分

Preset / Save / Backup System

========================================

*/


/*
初始化数据结构
*/


async function ensureSystemData(){


/*
默认预设

*/


let presets =
await get(
"presets",
"all"
);



if(!presets){


presets=[

{

id:"default",

name:"Sweet Dream 默认",

worldBook:"",

owner:"",

prompt:"保持沉浸式文游，不替玩家行动。"

}

];


await put(
"presets",
"all",
presets
);


}




/*
默认存档

*/


let saves =
await get(
"saves",
"all"
);



if(!saves){


saves=[

{

id:"save01",

name:"初始存档",

time:
new Date()
.toISOString(),

data:
structuredClone(
DEFAULT_GAME
)

}

];


await put(
"saves",
"all",
saves
);


}




}





/*

加载全部系统

*/


async function loadSystem(){


await ensureSystemData();


renderPresetList();


renderSaveList();



}




/*

========================

预设系统

========================

*/


async function renderPresetList(){


let presets =
await get(
"presets",
"all"
);



let select =
document.getElementById(
"presetSelect"
);



select.innerHTML="";



presets.forEach(
p=>{


let option =
document.createElement(
"option"
);



option.value=
p.id;


option.innerText=
p.name;



select.appendChild(
option
);



});


}





/*

保存当前为预设

*/


async function savePreset(){


let game =
await getGame();



let presets =
await get(
"presets",
"all"
);



let name =
prompt(
"请输入预设名称"
);



if(!name)
return;



let preset={


id:
"preset_"+
Date.now(),


name:name,


worldBook:
game.worldBook,


owner:
game.owner,


prompt:
""

};



presets.push(
preset
);



await put(
"presets",
"all",
presets
);



renderPresetList();


alert(
"预设保存成功"
);


}




/*

读取预设

*/


async function loadPreset(){


let id =
document.getElementById(
"presetSelect"
).value;



let presets =
await get(
"presets",
"all"
);



let preset =
presets.find(
p=>p.id===id
);



if(!preset)
return;



let game =
await getGame();



game.worldBook =
preset.worldBook;


game.owner =
preset.owner;



await saveGame(game);



render();


}




/*

========================

存档系统

========================

*/


async function renderSaveList(){


let saves =
await get(
"saves",
"all"
);



let select =
document.getElementById(
"saveSelect"
);



select.innerHTML="";



saves.forEach(
save=>{


let option =
document.createElement(
"option"
);



option.value=
save.id;


option.innerText=
save.name;



select.appendChild(
option
);



});



}




/*

保存存档槽

*/


async function saveSlot(){


let saves =
await get(
"saves",
"all"
);



let name =
prompt(
"存档名称"
);



if(!name)
return;



let game =
await getGame();



let save={


id:
"save_"+
Date.now(),


name:name,


time:
new Date()
.toISOString(),


data:
structuredClone(game)



};



saves.push(
save
);



await put(
"saves",
"all",
saves
);



await autoBackup();


renderSaveList();


alert(
"存档完成"
);



}




/*

读取存档

*/


async function loadSlot(){


let id =
document.getElementById(
"saveSelect"
).value;



let saves =
await get(
"saves",
"all"
);



let save =
saves.find(
s=>s.id===id
);



if(!save)
return;



await put(
"current",
"main",
structuredClone(
save.data
)
);



render();


alert(
"读取完成"
);


}




/*

========================

自动备份

========================

*/


async function autoBackup(){


let game =
await getGame();



let backups =
await get(
"backups",
"all"
);



if(!backups){

backups=[];

}




backups.push({

time:
new Date()
.toISOString(),


data:
structuredClone(game)


});



/*

只保留最近20份

*/


if(
backups.length>20
){

backups.shift();

}



await put(
"backups",
"all",
backups
);



}





/*

========================

导出全部数据

========================

*/


async function exportAll(){


let data={



version:"SweetDreamV1.1",


time:
new Date()
.toISOString(),


current:
await get(
"current",
"main"
),


presets:
await get(
"presets",
"all"
),


saves:
await get(
"saves",
"all"
),


backups:
await get(
"backups",
"all"
)



};



let blob =
new Blob(

[

JSON.stringify(
data,
null,
2
)

],

{

type:
"application/json"

}

);



let url =
URL.createObjectURL(
blob
);



let a =
document.createElement(
"a"
);



a.href=url;


a.download=
"SweetDream_Backup.json";



a.click();



URL.revokeObjectURL(
url
);



}





/*

========================

导入全部数据

========================

*/


async function importAll(event){


let file =
event.target.files[0];



if(!file)
return;



let text =
await file.text();



let data =
JSON.parse(
text
);



if(
data.current
){

await put(
"current",
"main",
data.current
);

}



if(
data.presets
){

await put(
"presets",
"all",
data.presets
);

}



if(
data.saves
){

await put(
"saves",
"all",
data.saves
);

}



if(
data.backups
){

await put(
"backups",
"all",
data.backups
);

}



render();


renderPresetList();


renderSaveList();



alert(
"数据恢复成功"
);



}




/*

========================

世界书 / 主人 / 记忆

========================

*/


async function saveWorld(){


let game =
await getGame();



game.worldBook =
document.getElementById(
"worldBook"
).value;



await saveGame(game);



}




async function saveOwner(){


let game =
await getGame();



game.owner =
document.getElementById(
"owner"
).value;



await saveGame(game);



}




async function saveMemory(){


let game =
await getGame();



game.memory =
document.getElementById(
"memory"
).value

.split("\n")

.filter(
x=>x.trim()
);



await saveGame(game);



}





/*

========================

渲染

========================

*/


async function render(){


let game =
await getGame();



document.getElementById(
"worldBook"
).value=
game.worldBook;



document.getElementById(
"owner"
).value=
game.owner;



document.getElementById(
"memory"
).value=
game.memory.join("\n");



document.getElementById(
"stats"
).innerHTML=

`

<div class="stat-box">

等级：
${game.state.level}

</div>


<div class="stat-box">

❤️ 好感：
${game.state.affection}

</div>


<div class="stat-box">

◆ 信任：
${game.state.trust}

</div>


<div class="stat-box">

◇ 依赖：
${game.state.dependency}

</div>

`;



renderMessages(game);



}



/*

聊天记录显示

*/


function renderMessages(game){


let chat =
document.getElementById(
"chat"
);



if(
!game.messages.length
){

chat.innerText=
"Sweet Dream 已启动。";


return;

}



chat.innerHTML=
game.messages
.map(

m=>{


return (

m.role==="user"

?

"你："+
m.text

:

"主人："+
m.text

);


}

)
.join(
"\n\n"
);



}



/*

启动第二部分

*/


loadSystem();

/*

==========================================

第三部分

AI Narrative Engine

==========================================

*/


/*

========================

DeepSeek配置

========================

*/


const AI_CONFIG={


model:
"deepseek-chat",


temperature:
0.85,


max_tokens:
2048


};





/*

========================

生成系统提示词

========================

*/


async function buildPrompt(){


let game =
await getGame();



let presets =
await get(
"presets",
"all"
);



let currentPresetId =
document.getElementById(
"presetSelect"
).value;



let preset =
presets.find(
p=>
p.id===currentPresetId
);





return `


你是 Sweet Dream 文游引擎。


================

核心规则

================


玩家是主控角色。


你只能描述：

- NPC行动
- 环境变化
- NPC语言
- NPC心理


禁止：

- 替玩家决定行动
- 替玩家说话
- 替玩家产生心理


保持沉浸式叙事。


================

输出格式

================


回复剧情时：

先输出正常剧情。


最后增加：

[GAME_DATA]

{
"affection":数字变化,
"trust":数字变化,
"dependency":数字变化,
"new_flags":[],
"memory":""
}


================

当前世界书

================

${game.worldBook}



================

主人设定

================

${game.owner}



================

长期记忆

================

${game.memory.join("\n")}



================

事件开关

================

${JSON.stringify(
game.flags
)}



================

当前变量

================

${JSON.stringify(
game.state
)}



================

预设补充

================

${preset?
preset.prompt:
""}


`;



}





/*

========================

发送消息

========================

*/


async function sendMessage(){



let input =
document.getElementById(
"message"
);



let text =
input.value.trim();



if(!text)
return;



let game =
await getGame();



await addMessage(
"user",
text
);



input.value="";



let key =
localStorage.getItem(
"deepseek_key"
);



if(
!key
){

key =
prompt(
"请输入 DeepSeek API Key"
);


if(key){

localStorage.setItem(
"deepseek_key",
key
);

}

}



if(!key){

alert(
"没有API Key"
);

return;

}





let promptText =
await buildPrompt();





try{


let response =
await fetch(

"https://api.deepseek.com/chat/completions",

{

method:
"POST",


headers:
{

"Content-Type":
"application/json",


"Authorization":
"Bearer "+
key


},


body:

JSON.stringify({

model:
AI_CONFIG.model,


temperature:
AI_CONFIG.temperature,


max_tokens:
AI_CONFIG.max_tokens,


messages:[


{

role:
"system",


content:
promptText


},


{

role:
"user",


content:
text


}


]


})

}

);




let result =
await response.json();




let answer =
result
.choices[0]
.message
.content;





/*

保存AI回复

*/


await addMessage(
"assistant",
answer
);





/*

解析变量

*/


await parseGameData(
answer
);





render();



}



catch(e){


console.error(e);


alert(
"AI请求失败"
);



}



}






/*

========================

消息保存

========================

*/


async function addMessage(
role,
text
){


let game =
await getGame();



game.messages.push({

role:role,

text:text,

time:
Date.now()

});



/*

限制消息数量

避免数据库无限膨胀

*/


if(
game.messages.length>200
){

game.messages.shift();

}



await saveGame(game);



}






/*

========================

变量解析

========================

*/


async function parseGameData(
text
){



let game =
await getGame();



let match =
text.match(
/\[GAME_DATA\]([\s\S]*)/
);



if(
!match
)
return;




try{


let json =
match[1]

.trim();



/*

去除可能的代码框

*/


json =
json
.replace(
/```json/g,
""
)

.replace(
/```/g,
""
);



let data =
JSON.parse(
json
);





/*

数值变化

*/


if(
data.affection
){

game.state.affection +=
Number(
data.affection
);

}



if(
data.trust
){

game.state.trust +=
Number(
data.trust
);

}



if(
data.dependency
){

game.state.dependency +=
Number(
data.dependency
);

}




/*

事件标签

*/


if(
Array.isArray(
data.new_flags
)
){


data.new_flags.forEach(
flag=>{


if(
!game.flags.includes(flag)
){

game.flags.push(flag);

}


});


}




/*

自动记忆

*/


if(
data.memory
){


game.memory.push(
data.memory
);



/*

最多保留50条

*/


if(
game.memory.length>50
){

game.memory.shift();

}



}




await saveGame(game);



}

catch(e){

console.log(
"变量解析失败",
e
);

}




}






/*

========================

手动变量调整

========================

*/


async function changeState(
key,
value
){


let game =
await getGame();



if(
game.state[key]
!==undefined
){

game.state[key]
=
value;

}



await saveGame(game);


render();


}





/*

========================

剧情重置

========================

*/


async function resetGame(){


if(
!confirm(
"确定清空当前剧情？"
)
)
return;



let game =
structuredClone(
DEFAULT_GAME
);



await saveGame(game);



render();


}





/*

========================

初始化完成

========================

*/


init();

</script>

</body>
