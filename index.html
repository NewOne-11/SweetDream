<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Dream</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="box">
        <!-- 视图 1：创建角色界面 -->
        <div id="view-creator">
            <h1>🌙 创建角色</h1>
            <div id="creator">
                正在加载角色模板...
            </div>
            <!-- 修改点：去掉了 onclick，增加 id -->
            <button id="btn-save-character">完成创建</button>
        </div>

        <!-- 视图 2：Controller 随机面具确认界面 -->
        <div id="view-match" class="hidden">
            <h1>⚡ 正在连线未知设备...</h1>
            <p class="subtitle">APP 正在根据您的角色倾向及性兴奋触发点，匹配相容的操控者频段。</p>
            
            <div id="match-loading-log"></div>

            <div id="controller-card" class="hidden">
                <div class="card-header">📡 已锁定操控者人格频段</div>
                <div class="card-body">
                    <p><strong>外显面具：</strong><span id="ctrl-primary-mask">-</span></p>
                    <p><strong>潜在内核：</strong><span id="ctrl-core">-</span></p>
                    <p><strong>现实关系：</strong><span id="ctrl-relation">-</span></p>
                    <p><strong>操控起点：</strong><span id="ctrl-starting">-</span></p>
                </div>
            </div>

            <!-- 修改点：去掉了 onclick，增加 id -->
            <button id="btn-enter-game" class="hidden">接受操控，接入梦境</button>
        </div>

        <!-- 视图 3：正式游戏终端（目标视角） -->
        <div id="view-game" class="hidden">
            <div class="game-layout">
                <div class="system-title">⏱ CONNECTED TERMINAL - [ 正在校准电波... ]</div>

                <div id="story-log"></div>

                <div class="control-bar">
                    <!-- 修改点：去掉了所有 tab-btn 的 onclick，增加了 id -->
                    <div class="app-buttons">
                        <button class="tab-btn" id="btn-tab-tasks">📱 APP 界面</button>
                        <button class="tab-btn" id="btn-tab-bag">📟 操控者状态</button>
                        <button class="tab-btn" id="btn-tab-settings">📖 设定书</button>
                    </div>
                    <input type="text" id="action-input" placeholder="输入你的行为或抵抗言行..." />
                    <!-- 修改点：去掉了 onclick，增加 id -->
                    <button class="btn btn-primary" id="btn-send-action" style="padding: 12px 25px;">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗组件 -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="app-modal" class="modal hidden">
        <div class="modal-header">
            <h2 id="modal-title">模块标题</h2>
            <!-- 修改点：去掉了 close-btn 的 onclick，增加 id -->
            <button class="close-btn" id="btn-close-modal">✕</button>
        </div>
        <div class="modal-body" id="modal-body-content"></div>
    </div>

    <script src="js/database.js"></script>
    <script type="module" src="js/creator.js"></script>
    <script type="module" src="js/runtime/uiRenderer.js"></script>
</body>
</html>
